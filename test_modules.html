    <style>
        body { background: #1a1a2e; color: #e0d8c8; font-family: monospace; padding: 20px; font-size: 14px; }
        .ok { color: #4caf50; }
        .err { color: #f44336; font-weight: bold; }
        .warn { color: #ff9800; }
        #log { white-space: pre-wrap; line-height: 1.6; }
        h2 { color: #c9a44c; border-bottom: 1px solid #333; padding-bottom: 5px; }

    <h1>🔍 Поиск сломанного модуля — Группы</h1>
    <div id="log"></div>

    <script>
        var log = document.getElementById('log');
        function ok(msg) { log.innerHTML += '<span class="ok">✅ ' + msg + '</span>\n'; }
        function err(msg) { log.innerHTML += '<span class="err">❌ ' + msg + '</span>\n'; }
        function info(msg) { log.innerHTML += '  ' + msg + '\n'; }
        function header(msg) { log.innerHTML += '\n<b style="color:#c9a44c">═══ ' + msg + ' ═══</b>\n'; }
        
        window.onerror = function(msg, url, line, col, error) {
            var file = url ? url.split('/').pop() : 'unknown';
            err('ОШИБКА в ' + file + ':' + line + ' — ' + msg);
            return false;
        };
    </script>
