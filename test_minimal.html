<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero RPG — Рабочая версия</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/eastern-theme.css">
</head>
<body>
    <div id="app">
        <div id="title-screen" class="screen active">
            <div class="title-container">
                <h1 class="title-text">零</h1>
                <h2 class="subtitle-text">ZERO RPG</h2>
                <p class="tagline">Путь к Бессмертию начинается с нуля</p>
                <div class="title-buttons">
                    <button id="btn-new-game" class="btn-eastern">新游戏 — Новая Игра</button>
                </div>
            </div>
        </div>

        <div id="creation-screen" class="screen">
            <div class="creation-container">
                <h2 class="section-title">命运之轮 — Колесо Судьбы</h2>
                <div class="creation-grid">
                    <div class="creation-left">
                        <div class="form-group">
                            <label>姓名 — Имя:</label>
                            <input type="text" id="char-name" placeholder="Введите имя героя..." maxlength="20">
                        </div>
                        <div class="form-group">
                            <label>性别 — Пол:</label>
                            <div class="gender-select">
                                <button class="btn-gender active" data-gender="male">男 — Мужской</button>
                                <button class="btn-gender" data-gender="female">女 — Женский</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>属性 — Характеристики:</label>
                            <div id="stats-display" class="stats-grid"></div>
                        </div>
                        <div class="creation-buttons">
                            <button id="btn-reroll" class="btn-eastern btn-small">🎲 Перебросить</button>
                            <button id="btn-start" class="btn-eastern" disabled>踏上征途 — Начать Путь</button>
                        </div>
                    </div>
                    <div class="creation-right">
                        <div id="fate-display" class="fate-panel"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div class="game-layout">
                <div class="narrative-panel">
                    <div id="scene-text" class="scene-text"></div>
                    <div id="choices-container" class="choices-container"></div>
                </div>
                <aside id="hud-panel" class="hud-panel">
                    <div id="hud-content"></div>
                </aside>
            </div>
        </div>
    </div>

    <!-- Только рабочие базовые модули -->
    <script src="src/state.js"></script>
    <script src="src/character/spirit_roots.js"></script>
    <script src="src/character/physique.js"></script>
    <script src="src/character/traits.js"></script>
    <script src="src/character/origin.js"></script>
    <script src="src/character/stats.js"></script>
    <script src="src/character/creation.js"></script>
    
    <script>
        // === Заглушки для отсутствующих модулей ===
        if (typeof Graphics === 'undefined') {
            window.Graphics = { 
                renderPortraitGrid: function(gender) {
                    var prefix = gender === 'female' ? 'female' : 'male';
                    var html = '<div class="fate-section"><div class="fate-label">肖像 — ПОРТРЕТ</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">';
                    for (var i = 1; i <= 4; i++) {
                        var path = 'assets/portraits/' + prefix + '_' + i + '.png';
                        html += '<div onclick="Graphics.selectPortrait(this,\'' + path + '\')" style="cursor:pointer;border:2px solid #555;border-radius:8px;overflow:hidden;transition:border-color 0.3s" data-portrait="' + path + '">';
                        html += '<img src="' + path + '" style="width:100%;display:block" onerror="this.parentElement.innerHTML=\'<div style=padding:20px;text-align:center;color:#666>Портрет ' + i + '</div>\'">';
                        html += '</div>';
                    }
                    html += '</div></div>';
                    return html;
                },
                selectPortrait: function(el, path) {
                    document.querySelectorAll('[data-portrait]').forEach(function(p) { p.style.borderColor = '#555'; });
                    el.style.borderColor = '#c9a44c';
                    if (CharacterCreation.currentRoll) CharacterCreation.currentRoll.portrait = path;
                }
            };
        }

        if (typeof GameLoop === 'undefined') {
            window.GameLoop = {
                startGame: function(character) {
                    document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
                    document.getElementById('game-screen').classList.add('active');
                    
                    var html = '<div style="padding:20px">';
                    html += '<h2 style="color:#c9a44c">🌍 ' + character.name + ', твой путь начинается!</h2>';
                    html += '<p>Тебе 16 лет. Ты стоишь на пороге своей судьбы.</p>';
                    html += '<hr style="border-color:#333">';
                    html += '<p><b>Корни:</b> ' + (character.roots.type === 'none' ? 'Нет (Путь Тела и Духа доступны)' : character.roots.type) + '</p>';
                    html += '<p><b>Телосложение:</b> ' + character.physique.name + '</p>';
                    html += '<p><b>Происхождение:</b> ' + character.origin.name + '</p>';
                    html += '<p><b>Черты:</b> ' + character.traits.map(function(t){return t.name}).join(', ') + '</p>';
                    html += '<hr style="border-color:#333">';
                    html += '<p style="color:#4caf50">✅ Создание персонажа работает! Полная версия с живым миром будет после исправления ошибок в тяжёлых модулях.</p>';
                    html += '</div>';
                    
                    document.getElementById('scene-text').innerHTML = html;
                }
            };
        }

        // === Запуск ===
        var App = {
            showScreen: function(id) {
                document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
                document.getElementById(id).classList.add('active');
            }
        };

        document.addEventListener('DOMContentLoaded', function() {
            console.log('[Zero RPG] Минимальная рабочая версия загружена');
            document.getElementById('btn-new-game').addEventListener('click', function() {
                App.showScreen('creation-screen');
                CharacterCreation.init();
            });
        });
    </script>
</body>
</html>
